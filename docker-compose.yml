services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ror}
      POSTGRES_USER: ${POSTGRES_USER:-ror}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ror}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $${POSTGRES_USER:-ror} -d $${POSTGRES_DB:-ror}]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ror:ror@db:5432/ror}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
